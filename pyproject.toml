[tool.poetry]
packages = [{include = "src"}]

[project]
name = "football-analytics"
version = "0.1.0"
description = ""
authors = [
    {name = "Lennon",email = "lennon.abonyi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.128.8,<0.129.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "alembic (>=1.18.4,<2.0.0)",
    "statsbombpy (>=1.17.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "arq (>=0.27.0,<0.28.0)",
    "redis (<6)",
    "orjson (>=3.11.8,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = [
  "pydantic.mypy"
]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "setuptools (>=80.10.2,<81.0.0)",
    "mypy (>=1.20.1,<2.0.0)"
]
